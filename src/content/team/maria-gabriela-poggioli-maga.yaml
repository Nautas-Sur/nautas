name: María Gabriela Poggioli (Maga)
role:
  es: sensibilidad y conexión
  en: Sensitivity and Connection
bio:
  es: >-
    Es licenciada en Literatura, escritora y astróloga. Se desempeñó varios años
    como “Live Manager”, en el ámbito de conciertos y presentaciones en vivo de
    música latina y rock nacional para una compañía multinacional reconocida.
    Posteriormente, dio un giro en su vida para dedicarse a su verdadera pasión
    por los animales y las plantas, que devino en jardines mágicos. Es la
    persona con la que puedes contar siempre. Se enfoca en lo hay y no en lo que
    falta. También de decirte justo lo que necesitabas oír sin siquiera saberlo.
  en: >-
    She has a degree in Literature, is a writer, and an astrologer. For several
    years, she worked as a Live Manager for a renowned multinational company,
    handling concerts and live performances of Latin and national rock music.
    Later, she changed course to dedicate herself to her true passion for
    animals and plants, which led to the creation of magical gardens. She is
    someone you can always count on. She focuses on what you have, not what's
    missing. She also has a knack for telling you exactly what you need to hear
    without you even realizing it.
order: 19
