name: Resonancia mórfica — Rupert Sheldrake (Reino Unido)
presentation:
  es: >-
    Rupert Sheldrake es biólogo y doctor por la Universidad de Cambridge, donde
    desarrolló investigaciones en biología del desarrollo. Su trayectoria
    científica y sus investigaciones sobre capacidades inexplicadas en seres
    humanos y animales lo llevaron a formular la hipótesis de la resonancia
    mórfica, una propuesta que plantea que la memoria podría ser inherente a la
    naturaleza y que los sistemas naturales se organizan a partir de hábitos que
    evolucionan en el tiempo, en lugar de responder únicamente a leyes fijas. Su
    trabajo explora las fronteras entre ciencia, naturaleza y consciencia, y ha
    generado un amplio debate dentro y fuera del ámbito científico. Es autor de
    numerosos libros, entre ellos *Una nueva ciencia de la vida*, *El espejismo
    de la ciencia* y *La ciencia y las prácticas espirituales*. Fue entrevistado
    para *Voces de la Tierra*.
  en: >-
    Rupert Sheldrake is a biologist and holds a doctorate from the University of
    Cambridge, where he conducted research in developmental biology. His
    scientific career and his investigations into unexplained abilities in
    humans and animals led him to formulate the morphic resonance hypothesis, a
    proposal that suggests memory may be inherent in nature and that natural
    systems are organized around habits that evolve over time, rather than
    responding solely to fixed laws. His work explores the boundaries between
    science, nature, and consciousness, and has generated extensive debate both
    within and beyond the scientific community. He is the author of numerous
    books, including *A New Science of Life*, *The Illusion of Science*, and
    *Science and Spiritual Practices*. He was interviewed for *Voices of the
    Earth*.
