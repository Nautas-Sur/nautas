name: Satish Kumar Foundation (Reino Unido)
presentation:
  es: >-
    Satish Kumar nació en India, y se convirtió en monje jainista a los nueve
    años. A los dieciocho dejó la vida monástica, inspirado por las enseñanzas
    de Gandhi sobre no violencia y reforma agraria, para sumarse al movimiento
    de Vinoba Bhave. Emprendió junto a E. P. Menon una caminata de más de 8.000
    millas por la paz —de Nueva Delhi a Moscú, París, Londres y Washington—
    visitando las capitales de las potencias nucleares. Fundó Schumacher College
    en 1991 y fue durante décadas editor de la revista Resurgence & Ecologist.
    La fundación que lleva su nombre sostiene a la continuidad de una Schumacher
    College independiente y una red global de iniciativas afines a su legado. En
    el primer episodio de Voces de la Tierra, Satish Kumar desarrolla por qué la
    ecología necesita una base espiritual para ser efectiva. 
  en: >-
    Satish Kumar was born in India and became a Jain monk at the age of nine. At
    eighteen, he left monastic life, inspired by Gandhi's teachings on
    nonviolence and land reform, to join the Vinoba Bhave movement. Together
    with E. P. Menon, he embarked on an 8,000-mile peace walk—from New Delhi to
    Moscow, Paris, London, and Washington—visiting the capitals of the nuclear
    powers. He founded Schumacher College in 1991 and was for decades the editor
    of the magazine Resurgence & Ecologist. The foundation that bears his name
    supports the continuation of an independent Schumacher College and a global
    network of initiatives aligned with his legacy. In the first episode of
    Voices of the Earth, Satish Kumar explains why ecology needs a spiritual
    foundation to be effective.
