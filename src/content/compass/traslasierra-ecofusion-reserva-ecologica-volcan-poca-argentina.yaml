name: Traslasierra Ecofusión / Reserva Ecológica Volcán Poca (Argentina)
presentation:
  es: >-
    Coordinada por Sacha Laniado, es una reserva privada de 225 hectáreas de
    monte nativo en la ecorregión del Cerro el Cóndor situado en Pampa de Pocho,
    hábitat del cóndor andino y refugio de bosques de palmera caranday, molle de
    beber, aromitos y chañares, junto a especies en recuperación como el
    algarrobo y el orco quebracho. Funciona simultáneamente como productora
    primaria de hierbas aromáticas y medicinales desde hace más de 15 años, con
    líneas de productos de herboristería autóctonos, y como espacio de puertas
    abiertas que ofrece cursos de herbolaria integral intensiva, fitomedicina
    aplicada, retiros de hierbas y naturaleza, y encuentros creativos de arte en
    la reserva, además de un refugio de montaña para alojamiento.
  en: >-
    Coordinated by Sacha Laniado, this 225-hectare private reserve of native
    forest is located in the Cerro el Cóndor ecoregion in Pampa de Pocho, a
    habitat for the Andean condor and a refuge for caranday palm, molle de
    beber, aromito, and chañar trees, along with recovering species such as the
    algarrobo and quebracho trees. It operates simultaneously as a primary
    producer of aromatic and medicinal herbs, with lines of native herbal
    products, and as an open space offering intensive courses in holistic
    herbalism, applied phytomedicine, herb and nature retreats, and creative art
    workshops within the reserve, in addition to a mountain refuge for lodging.
