name: Santos Tiscornia
role:
  es: Presidente. Coordinación estratégica y producción general.
  en: President. Strategic coordination and general production.
bio:
  es: >-
    Santos Tiscornia es consultor en marketing, comunicación y producción, con
    más de 30 años de experiencia en proyectos educativos, culturales,
    institucionales y comerciales. Se especializa en estrategias integrales de
    comunicación, marketing digital, desarrollo de marcas, producción
    audiovisual y diseño de experiencias. Ha dirigido agencias, liderado
    lanzamientos y campañas, y asesorado a universidades y empresas en procesos
    de innovación y expansión. Es fundador y presidente de Nautas, donde impulsa
    proyectos que integran arte, ciencia y consciencia. Su formación abarca
    marketing, antropología y derecho.
  en: >-
    Santos Tiscornia is a marketing, communications, and production consultant
    with over 30 years of experience in educational, cultural, institutional,
    and commercial projects. He specializes in integrated communications
    strategies, digital marketing, brand development, audiovisual production,
    and experience design. He has directed agencies, led product launches and
    campaigns, and advised universities and companies on innovation and
    expansion processes. He is the founder and president of Nautas, where he
    promotes projects that integrate art, science, and consciousness. His
    background includes marketing, anthropology, and law.
order: 30
