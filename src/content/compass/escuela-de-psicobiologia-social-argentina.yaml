name: Escuela de Psicobiología Social (Argentina)
presentation:
  es: >-
    Creada por el Dr. Fernando Callejón, propone la Medicina Psicobiológica
    (MPB) como un cuerpo de conocimiento que parte de la asociación del Dr.
    Hamer y evoluciona hacia una mirada propia, más amplia e inclusiva, en la
    que el propio concepto de "enfermedad" es puesto en cuestión. Su propuesta
    central sostiene que el orden social y factores socioculturales como la
    explotación o la exclusión inciden directamente en los procesos de salud y
    enfermedad de las personas, y plantea que el síntoma puede leerse como una
    forma en que el cuerpo denuncia esas condiciones. Fernando Callejón fue
    entrevistado extensamente para Voces de la Tierra, donde desarrolla estos
    conceptos y su evolución en espiral hacia una visión cada vez más profunda
    de su propia teoría.
  en: >-
    Created by Dr. Fernando Callejón, Psychobiological Medicine (PBM) proposes a
    body of knowledge that stems from Dr. Hamer's association with the field and
    evolves toward its own broader and more inclusive perspective, in which the
    very concept of "disease" is questioned. Its central tenet maintains that
    social order and sociocultural factors such as exploitation and exclusion
    directly influence people's health and illness processes, and posits that
    symptoms can be interpreted as the body's way of denouncing these
    conditions. Fernando Callejón was interviewed extensively for Voces de la
    Tierra, where he elaborates on these concepts and their spiraling evolution
    toward an increasingly profound understanding of his own theory.
