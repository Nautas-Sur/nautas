name: María José Bufager
role:
  es: Secretaria de la Asociación
  en: Secretary of the Association
bio:
  es: >-
    Es abogada, astróloga y tiene estudios de psicología y una tecnicatura
    superior en desarrollo humano. 

    Es cofundadora y secretaria de Nautas. Asumió distintos roles en las
    producciones audiovisuales de la Asociación.

    Se dedica a tareas específicas en el estudio de abogacía que es sede de la
    ONG y a sus predilecciones humanísticas y terapéuticas. 
  en: >-
    She is a lawyer, astrologer, and has studied psychology and holds an
    advanced technical degree in human development.

    She is a co-founder and secretary of Nautas. She has held various roles in
    the Association's audiovisual productions.

    She dedicates herself to specific tasks at the law firm that houses the NGO
    and to her humanistic and therapeutic pursuits.
order: 10
