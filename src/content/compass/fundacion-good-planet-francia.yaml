name: Fundación GoodPlanet (Francia)
presentation:
  es: >-
    Creada y presidida por el fotógrafo y documentalista Yann Arthus-Bertrand,
    reconocido internacionalmente por su trabajo de fotografía aérea, la
    fundación despliega proyectos de campo enfocados en biodiversidad, agua,
    educación ambiental y compensación de carbono: hasta la fecha ha
    desarrollado 41 proyectos en 21 países de cuatro continentes, con más de
    150.000 personas beneficiadas, ocho escuelas bioclimáticas construidas y más
    de 180.000 toneladas de CO₂ compensadas. Su sede, el Domaine de Longchamp,
    un predio parisino, funciona como espacio gratuito de exposiciones, charlas,
    proyecciones y talleres abierto a familias y visitantes. Yann
    Arthus-Bertrand fue entrevistado en París para el episodio de cierre de
    Voces de la Tierra. 
  en: >-
    Founded and chaired by photographer and documentary filmmaker Yann
    Arthus-Bertrand, internationally renowned for his aerial photography, the
    foundation carries out field projects focused on biodiversity, water,
    environmental education, and carbon offsetting. To date, it has developed 41
    projects in 21 countries across four continents, benefiting more than
    150,000 people, building eight bioclimatic schools, and offsetting more than
    180,000 tons of CO₂. Its headquarters, the Domaine de Longchamp, a Parisian
    estate, serves as a free space for exhibitions, talks, screenings, and
    workshops open to families and visitors. Yann Arthus-Bertrand was
    interviewed in Paris for the closing episode of Voices of the Earth.
