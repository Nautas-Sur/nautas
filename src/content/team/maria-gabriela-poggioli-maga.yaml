name: María Gabriela Poggioli (Maga)
role:
  es: Vocal
  en: associate
bio:
  es: >-
    Es licenciada en Literatura, escritora y astróloga. Es la persona con la que
    puedes contar siempre. Se enfoca en lo hay y no en lo que falta. Hace que
    todos se sientan nutridos y cuidados, desde asegurarse de que tengas algo de
    beber hasta decirte justo lo que necesitabas oír sin siquiera saberlo. Su
    pasión por los animales y las plantas, deviene en jardines mágicos. 
  en: >-
    She has a degree in Literature, is a writer, and an astrologer. She's
    someone you can always count on. She focuses on what you have, not what's
    missing. She makes everyone feel nurtured and cared for, from making sure
    you have something to drink to telling you exactly what you needed to hear
    without even realizing it. Her passion for animals and plants leads her to
    create magical gardens.
order: 19
