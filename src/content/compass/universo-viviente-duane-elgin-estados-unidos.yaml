name: Universo viviente — Duane Elgin (Estados Unidos)
presentation:
  es: >-
    Duane Elgin es autor, científico social y visionario. Trabajó como
    científico social y en el centro de estudios SRI International; coautor de
    numerosos estudios para organismos como Asesor Científico y la National
    Science Foundation. Cofundó tres organizaciones sin fines de lucro dedicadas
    a la rendición de cuentas de los medios y a las "asambleas ciudadanas
    electrónicas", y recibió el Premio de la Paz de Japón (Goi Award) por su
    aporte a una cultura más sustentable y consciente. Es autor de Voluntary
    Simplicity —texto de referencia del movimiento de la simplicidad
    voluntaria—, Awakening Earth, The Living Universe y Choosing Earth, proyecto
    que codirige actualmente. Fue entrevistado para Voces de la Tierra.
  en: >-
    Duane Elgin is an author, social scientist, and visionary. He worked as a
    social scientist and at the think tank SRI International; he co-authored
    numerous studies for organizations such as the Scientific Advisor and the
    National Science Foundation. He co-founded three non-profit organizations
    dedicated to media accountability and "electronic citizens' assemblies," and
    received Japan's Goi Peace Prize for his contribution to a more sustainable
    and conscious culture. He is the author of *Voluntary Simplicity*—a seminal
    text of the voluntary simplicity movement—*Awakening Earth*, *The Living
    Universe*, and *Choosing Earth*, a project he currently co-directs. He was
    interviewed for Voices of the Earth.
