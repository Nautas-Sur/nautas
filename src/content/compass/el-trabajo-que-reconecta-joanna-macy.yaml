name: 'El Trabajo que Reconecta (Joanna Macy) '
presentation:
  es: >-
    Marco teórico y metodológico desarrollado por la ecofilósofa y activista
    budista estadounidense Joanna Macy, que integra budismo, teoría de sistemas
    y ecología profunda en una propuesta de trabajo grupal orientada a sostener
    y atravesar el dolor frente a la crisis ecológica, transformándolo en
    compromiso y acción. A lo largo de décadas, Macy articuló investigación
    académica, activismo por la paz y la justicia social y una profunda
    exploración de nuestra relación con la Tierra. Su propuesta se ha extendido
    internacionalmente a través de formaciones, talleres e inmersiones
    vivenciales. En el mundo hispanohablante, TQR Latino, coordinado por Adrián
    Villaseñor Galarza, desarrolla esta perspectiva mediante cursos y espacios
    de formación para facilitadores. Joanna Macy fue una de las principales
    entrevistadas para Voces de la Tierra.
  en: >-
    A theoretical and methodological framework developed by the American
    ecophilosopher and Buddhist activist Joanna Macy, which integrates Buddhism,
    systems theory, and deep ecology into a group work approach aimed at
    sustaining and processing the pain of the ecological crisis, transforming it
    into commitment and action. For decades, Macy has combined academic
    research, activism for peace and social justice, and a profound exploration
    of our relationship with the Earth. Her approach has spread internationally
    through training programs, workshops, and experiential immersions. In the
    Spanish-speaking world, TQR Latino, coordinated by Adrián Villaseñor
    Galarza, develops this perspective through courses and training programs for
    facilitators. Joanna Macy was one of the main interviewees for Voices of the
    Earth.
