episodes:
  - number: 1
    videoId: bcb8oPQM2RQ
    title:
      es: Hermanita Sudamérica - Bolivia
      en: South América Little Sister - Bolivia
    description:
      es: >-
        El propósito último de esta serie documental considera que la plenitud y
        dignidad de los habitantes de todo el continente depende de distintos
        factores y de la posibilidad de cubrir sus necesidades básicas, los
        pueblos viven más dichosamente si se nutren también cultural y
        espiritualmente.
      en: >-
        The ultimate purpose of this documentary series considers that the
        fulfillment and dignity of the inhabitants of the entire continent
        depends on various factors and the possibility of meeting their basic
        needs; people live more happily if they are also nourished culturally
        and spiritually.
