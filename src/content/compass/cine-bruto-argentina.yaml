name: Cine Bruto (Argentina)
presentation:
  es: >-
    Productora audiovisual dirigida por José Celestino Campusano, reconocida en
    el circuito del cine independiente argentino e internacional por una mirada
    cruda, directa y sin concesiones. Su obra se acerca a realidades sociales y
    territorios frecuentemente invisibilizados, especialmente del conurbano
    bonaerense y del interior del país, construyendo relatos que buscan
    preservar la autenticidad de las experiencias que retratan. Una de sus
    características distintivas es el trabajo con protagonistas no
    profesionales, muchas veces provenientes de las propias comunidades donde se
    desarrollan las historias. Entre sus producciones se encuentran Territorio,
    Los ojos de Van Gogh, El Clan Vega, La reina desnuda, Poder Mayor & Poder
    Menor y En los ojos de Verónica, entre muchas otras.
  en: >-
    Audiovisual production company directed by José Celestino Campusano,
    recognized in the Argentine and international independent film circuit for a
    raw, direct and uncompromising look. His work approaches social realities
    and frequently made invisible territories, especially in the Buenos Aires
    suburbs and the interior of the country, constructing stories that seek to
    preserve the authenticity of the experiences they portray. One of its
    distinctive characteristics is the work with non-professional protagonists,
    often coming from the communities where the stories take place. Among his
    productions are Territorio, Van Gogh's Eyes, El Clan Vega, La Reina Naked,
    Poder Mayor & Poder Menor and In the Eyes of Verónica, among many others.
