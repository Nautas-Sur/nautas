name: Carolina Maren
role:
  es: Directora de contenidos y desarrollo de proyectos.
  en: Director of content and project development.
bio:
  es: >
    Comunicadora, escritora, locutora y guionista. Su formación integra química
    biológica, filosofía, psicología, budismo tibetano y Advaita Vedanta. Cuenta
    con más de 20 años de experiencia en prensa y comunicación, y se especializa
    en educación, salud e investigación filosófico-científica. Es cofundadora y
    directora de Desarrollo de Proyectos de Nautas, donde impulsa
    investigaciones, talleres y eventos que integran arte, ciencia y
    consciencia. Ha dirigido y guionado diversos proyectos audiovisuales y
    culturales.
  en: >-
    Communicator, writer, broadcaster, and screenwriter. Her background
    encompasses biological chemistry, philosophy, psychology, Tibetan Buddhism,
    and Advaita Vedanta. She has over 20 years of experience in journalism and
    communications, specializing in education, health, and
    philosophical-scientific research. She is the co-founder and Director of
    Project Development at Nautas, where she promotes research, workshops, and
    events that integrate art, science, and consciousness. She has directed and
    written scripts for various audiovisual and cultural projects.
order: 40
