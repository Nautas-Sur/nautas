name: Fermín Tiscornia
role:
  es: ciencia de datos y territorio
  en: Data Science and Territory
bio:
  es: >-
    Fermín es Licenciado en Ciencia de Datos y productor agropecuario. Combina
    su formación y experiencia en el ámbito tecnológico con la cría y el cuidado
    de animales en su propia granja en la Provincia de Buenos Aires, integrando
    conocimiento científico, pensamiento analítico y experiencia práctica en el
    ámbito rural.
  en: >-
    Fermín holds a degree in Data Science and is an agricultural producer. He
    combines his training and experience in the technological field with raising
    and caring for animals on his own farm in the Province of Buenos Aires,
    integrating scientific knowledge, analytical thinking, and practical
    experience in the rural environment.
