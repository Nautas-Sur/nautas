name: Fundación Columbia (Argentina)
presentation:
  es: >-
    Con sede en Buenos Aires, Fundación Columbia es un espacio dedicado al
    desarrollo de la consciencia, el bienestar y la exploración de distintas
    dimensiones de la experiencia humana. Desde hace más de una década ofrece
    formaciones anuales, cursos, talleres, encuentros y actividades que
    articulan espiritualidad, desarrollo personal y diferentes campos del
    conocimiento, junto con una escuela de formación transpersonal y programas
    dirigidos a públicos diversos. Su propuesta busca generar espacios de
    aprendizaje, reflexión y transformación, promoviendo el encuentro entre
    distintas tradiciones y perspectivas contemporáneas. Para Nautas, Columbia
    constituye un espacio afín con el que compartimos el interés por explorar
    los vínculos entre consciencia, conocimiento y transformación cultural. En
    2020, su Ciclo de Cine Ambiental fue el espacio elegido para el estreno
    online de la serie documental Voces de la Tierra.
  en: >-
    Based in Buenos Aires, Fundación Columbia is a space dedicated to the
    development of consciousness, well-being and the exploration of different
    dimensions of the human experience. For more than a decade, it has offered
    annual training, courses, workshops, meetings and activities that articulate
    spirituality, personal development and different fields of knowledge, along
    with a transpersonal training school and programs aimed at diverse
    audiences. Its proposal seeks to generate spaces for learning, reflection
    and transformation, promoting the encounter between different traditions and
    contemporary perspectives. For Nautas, Columbia constitutes a related space
    with which we share the interest in exploring the links between
    consciousness, knowledge and cultural transformation. In 2020, its
    Environmental Film Series was the space chosen for the online premiere of
    the documentary series Voices of the Earth.
