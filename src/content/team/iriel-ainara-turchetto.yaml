name: Iriel Ainara Turchetto
role:
  es: conexiones y nuevos horizontes
  en: Connections and New Horizons
bio:
  es: >-
    Iriel se especializó en análisis y gestión de cuentas para empresas
    multinacionales, brindando servicios a clientes de Estados Unidos y España.
    Se formó en Dirección de Empresas Turísticas en EAE Business School de
    Barcelona. Desde 2019 desarrolla una vida vinculada al viaje y al turismo,
    residiendo y desplazándose alternativamente entre Europa, Argentina y
    Oceanía.
  en: >-
    Iriel specialized in account analysis and management for multinational
    companies, providing services to clients in the United States and Spain. She
    studied Tourism Business Management at EAE Business School in Barcelona.
    Since 2019, her life has been connected to travel and tourism, living and
    traveling between Europe, Argentina, and Oceania.
order: 10
