bio:
  es: >-
    Miro es programador, músico y astrólogo, con una profunda dedicación al
    estudio de las matemáticas en sus múltiples formas. Su mirada integra
    pensamiento lógico, programación, música y exploración de los vínculos entre
    matemática, conocimiento y las distintas formas de comprender la realidad.
  en: >-
    Miro is a programmer, musician, and astrologer, deeply dedicated to the
    study of mathematics in its many forms. His approach integrates logical
    thinking, programming, music, and the exploration of the links between
    mathematics, knowledge, and different ways of understanding reality.
