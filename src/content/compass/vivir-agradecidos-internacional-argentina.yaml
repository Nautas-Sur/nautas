name: Vivir Agradecidos (internacional/Argentina)
presentation:
  es: >-
    Fundación inspirada en la obra de David Steindl-Rast, monje benedictino y
    referente mundial de la práctica de la gratitud consciente, autor de
    numerosos libros y fundador de gratefulness.org. En Argentina, la fundación
    es dirigida por Beto Risso y sostiene una comunidad de prácticas orientadas
    a cultivar la gratitud como una forma de presencia y transformación: la
    Pausa de los Viernes, el Círculo de Gratitud mensual, un club de lectura,
    meditaciones guiadas, el podcast Ecos y encuentros como la Noche de la
    Gratitud. Su propuesta invita a detenerse, reconocer lo recibido y recuperar
    una mirada más consciente sobre la vida, los vínculos y nuestra relación con
    la naturaleza. En Voces de la Tierra, el Br. David Steindl-Rast comparte una
    reflexión sobre la reconexión con la naturaleza, el corazón humano y su
    apertura al misterio del cosmos.
  en: >-
    A foundation inspired by the work of David Steindl-Rast, a Benedictine monk
    and world-renowned expert on the practice of mindful gratitude, author of
    numerous books and founder of gratefulness.org. In Argentina, the foundation
    is directed by Beto Risso and supports a community of practices aimed at
    cultivating gratitude as a form of presence and transformation: the Friday
    Pause, the monthly Gratitude Circle, a book club, guided meditations, the
    Ecos podcast, and gatherings such as the Night of Gratitude. Its approach
    invites people to pause, acknowledge what they have received, and rediscover
    a more conscious perspective on life, relationships, and our connection with
    nature. In Voices of the Earth, Brother David Steindl-Rast shares a
    reflection on reconnecting with nature, the human heart, and its openness to
    the mystery of the cosmos.
