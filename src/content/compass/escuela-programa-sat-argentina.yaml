name: Escuela Programa SAT (Argentina)
presentation:
  es: >-
    El Programa SAT fue creado por el psiquiatra chileno Claudio Naranjo como un
    laboratorio grupal y vivencial que combina la psicología de los eneatipos,
    técnicas corporales, meditación y distintas líneas de trabajo terapéutico,
    perfeccionado a lo largo de más de 40 años de desarrollo. En Argentina, la
    escuela es dirigida por Lidia Grammatico, quien continúa la transmisión de
    este legado a través del taller introductorio, los cuatro niveles del
    Programa SAT y encuentros de seguimiento en distintas sedes del país, además
    de espacios vinculados y prácticas de meditación. Claudio Naranjo fue uno de
    los entrevistados de la serie Voces de la Tierra.
  en: >-
    The SAT Program was created by Chilean psychiatrist Claudio Naranjo as a
    group and experiential laboratory that combines enneagram psychology,
    bodywork techniques, meditation, and various therapeutic approaches, refined
    over more than 40 years of development. In Argentina, the school is directed
    by Lidia Grammatico, who continues to transmit this legacy through the
    introductory workshop, the four levels of the SAT Program, and follow-up
    meetings at different locations throughout the country, as well as related
    spaces and meditation practices. Claudio Naranjo was one of the interviewees
    in the series Voices of the Earth.
