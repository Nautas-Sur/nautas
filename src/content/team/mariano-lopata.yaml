bio:
  es: >-
    Psicólogo, docente e investigador. 

    ​Se dedica a investigar y enseñar sobre cómo las tecnologías transforman
    nuestra educación y las formas de aprendizaje. Lidera proyectos de impacto
    social y educativo a nivel nacional e internacional.

    ​Es especialista  en Metodología de la Investigación Científica.

    Padre, compañero, poeta, y enamorado de la vida y su misterio.
  en: >-
    Psychologist, teacher, and researcher.


    He dedicates himself to researching and teaching about how technologies are
    transforming our education and learning methods. He leads social and
    educational impact projects at the national and international levels.


    He specializes in Scientific Research Methodology.

    Father, partner, poet, and lover of life and its mysteries.
