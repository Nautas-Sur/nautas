title: Hermanita Sudamérica
order: 48
kind: Serie Documental
pillar: arte
status: in_development
featured: false
tagline:
  es: >-
    Un puente cultural entre los pueblos sudamericanos a través del arte, la
    música y la narrativa compartida.
  en: >-
    A cultural bridge between South American peoples through art, music, and
    shared narrative.
description:
  es: >
    Hermanita Sudamérica es un proyecto de hermandad continental que busca tejer
    lazos entre las culturas sudamericanas a través del arte, la música y las
    narrativas compartidas.


    En un continente tan diverso como unido por raíces comunes, el proyecto
    explora las expresiones culturales que nos conectan y celebra la riqueza de
    nuestras diferencias.


    A través de documentales, encuentros y producciones colaborativas, Hermanita
    Sudamérica construye un mapa vivo de la identidad cultural del continente.
  en: >
    Hermanita Sudamérica is a continental fellowship project that seeks to weave
    bonds between South American cultures through art, music, and shared
    narratives.


    In a continent as diverse as it is united by common roots, the project
    explores the cultural expressions that connect us and celebrates the
    richness of our differences.


    Through documentaries, gatherings, and collaborative productions, Hermanita
    Sudamérica builds a living map of the continent's cultural identity.
