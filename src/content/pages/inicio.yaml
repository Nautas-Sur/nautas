hero_eyebrow:
  es: Nautas - Asociación civil sin fines de lucro
  en: Nautas - Non-profit civil association
hero_title:
  es: Arte, Ciencia *y Consciencia*
  en: Arts, Sciences *and Consciousness*
hero_subtitle:
  es: "Nautas es una asociación civil dedicada a sobrevolar la brecha entre la exploración científica, la expresión artística y la indagación acerca de la consciencia humana. Producimos contenido audiovisual e investigaciones que aúnan voces de todos los rincones del planeta.\nElegimos la palabra `Nautas´ para nombrar a todos quienes exploran: no sólo los cielos, la tierra y los océanos, sino también los exploradores de la conciencia humana, cual si fuese una sustancia esencial, como el agua o el aire. Nautas nombra, entonces, a quienes pueden considerarse navegantes de la existencia y del misterio de Ser.\nEn ese sentido, Nautas señala dentro de las diferencias, la condición de igualdad: todos somos experimentadores de la existencia, desde el principio de los tiempos. La cualidad de nauta nombra esa paridad fundamental ante el acontecimiento que todos compartimos: encontrarnos, una y otra vez, frente a la inmensidad y lo desconocido.\nEl fenómeno del que hablamos es el de una transición, un proceso de transformación de la conciencia humana. Para Nautas, es tan misterioso lo que vivimos ahora como lo que sucedió en el pasado, y más misterioso aún el estado que se aproxima.\nEn este sitio encontrarán el mensaje, la obra y el pensamiento documentado de hombres y mujeres de todos los tiempos: precursores, exploradores de avanzada, o simplemente peldaños en la evolución natural de nuestra especie. Los reconocemos como compañeros de travesía y no como figuras distantes.\nInvitamos a recorrer este portal a través de pasajes no taxonómicos, que proponen una diferenciación dinámica entre quienes investigaron o investigan conscientemente tres enigmas fundamentales:\n\n·\tEl primer enigma: de la Consciencia —con una distinción intencionada entre mente, conciencia y espíritu—.\n·\tEl segundo enigma: del Espíritu Holístico —que integra lo que la especialización científica ha fragmentado—.\n·\tEl tercer enigma: del Corazón del Arte —principamente expresado a través de la creatividad—.\n"
  en: >-
    Nautas is a civil association dedicated to bridging the gap between
    scientific exploration, artistic expression, and inquiry into human
    consciousness. We produce audiovisual content and research that brings
    together voices from all corners of the planet.


    We chose the word "Nautas" to name all those who explore: not only the
    skies, the land, and the oceans, but also the explorers of human
    consciousness, as if it were an essential substance, like water or air.
    Nautas, then, names those who can be considered navigators of existence and
    the mystery of Being.

    In this sense, Nautas points to the condition of equality within our
    differences: we are all experiencers of existence, we have been since the
    beginning of time. The quality of being a nauta names this fundamental
    parity before the event we all share: finding ourselves, time and again,
    facing immensity and the unknown.


    The phenomenon we are talking about is that of a transition, a process of
    transformation of human consciousness. For Nautas, what we are experiencing
    now is as mysterious as what happened in the past, and the approaching state
    is even more so.


    On this site, you will find the message, the work, and the documented
    thought of men and women from all eras: forerunners, pioneering explorers,
    or simply stepping stones in the natural evolution of our species. We
    recognize them as fellow travelers, not as distant figures.


    We invite you to explore this portal through non-taxonomic passages, which
    propose a dynamic differentiation between those who investigate or
    consciously investigate three fundamental enigmas:


    • The first enigma: of Consciousness—with an intentional distinction between
    mind, consciousness, and spirit.


    • The second enigma: of the Holistic Spirit—which integrates what scientific
    specialization has fragmented.


    • The third enigma: of the Heart of Art—primarily expressed through
    creativity.
pillars_title:
  es: Diferentes Dimensiones, *una misma Fuente.*
  en: Different Dimensions, *One Source.*
pillar_arte_title:
  es: Arte
  en: Art
pillar_arte_desc:
  es: >
    Arte: inspiración. Expresiones creativas que amplían los límites de la
    percepción y conectan con la belleza esencial de la existencia.

    En Nautas encontrarán un espacio abierto a todas las expresiones que nacen
    de un corazón en transformación. Un llamado a quienes están en posición de
    combinar sus talentos con una conciencia profunda: quienes están en vías al
    desasimiento, que no están obsesionados consigo mismos, que tienen la mirada
    hacia adelante sin distracciones, que evitan la autocomplacencia y el
    capricho de los artistas consentidos.

    Nautas aspira a reconocer en las obras y acciones de los artistas la
    inspiración que reciben de la voluntad universal, del amor incondicional, y
    que pueden compartir a través de sus creaciones como seres conscientes.

    Abordamos el arte como realización creativa, como medicina para una curación
    físico-emocional, como sendero espiritual, como camino de conocimiento de
    nuestras luces y sombras, como puente hacia una sensibilidad consciente.
  en: >-
    Art: inspiration. Creative expressions that expand the limits of perception
    and connect with the essential beauty of existence.

    At Nautas, you will find a space open to all expressions born from a heart
    in transformation. A call to those who are in a position to combine their
    talents with a profound awareness: those on the path to detachment, who are
    not obsessed with themselves, who look ahead without distractions, who avoid
    self-indulgence and the whims of pampered artists.

    Nautas aspires to recognize in the works and actions of artists the
    inspiration they receive from the universal will, from unconditional love,
    and which they can share through their creations as conscious beings.

    We approach art as creative fulfillment, as medicine for physical and
    emotional healing, as a spiritual path, as a way of knowing our light and
    shadow, as a bridge to conscious sensitivity.
pillar_ciencia_title:
  es: Ciencia
  en: Science
pillar_ciencia_desc:
  es: >
    Ciencia: finales de la era de la razón. Investigación rigurosa que ilumina
    los misterios del cosmos y nuestra posición en la trama de la vida.

    Sin deshonrar la solidez de la tierra como apoyo, nos dirigimos a un vuelo
    esencial conjunto hacia el cielo —espíritu y conciencia—. Partimos desde el
    conocimiento racional sabiendo que existe un nuevo punto de vista.
    Profundizamos en cada materia sin volvernos obsesivos. Reconocemos un estado
    en el que podemos atravesar las trampas del pensamiento para llegar a ese
    centro impersonal que es la conciencia universal.

    Nautas concibe la ciencia al servicio de la conciencia. Aborda todas las
    ciencias —sociales, naturales y abstractas— aplicadas a la evolución de la
    conciencia en la Tierra: ciencias como metamorfosis, como eslabón cognitivo,
    que indagan acerca de la vida, la naturaleza de la mente, el psiquismo y el
    espíritu. Como intuición de otros órdenes del saber y otros órdenes de
    realidad. Como tratamiento respetuoso hacia la naturaleza. Como práctica
    espiritual. Ciencias del medio ambiente, la biodiversidad, la biósfera.
  en: >-
    Science: the end of the age of reason. Rigorous research that illuminates
    the mysteries of the cosmos and our place in the web of life.

    Without disregarding the solidity of the earth as our foundation, we embark
    on an essential, shared flight toward the heavens—spirit and consciousness.
    We begin with rational knowledge, knowing that a new perspective exists. We
    delve into each subject without becoming obsessive. We recognize a state in
    which we can transcend the traps of thought to reach that impersonal center
    which is universal consciousness.

    Nautas conceives of science as serving consciousness. It addresses all
    sciences—social, natural, and abstract—applied to the evolution of
    consciousness on Earth: sciences as metamorphosis, as a cognitive link, that
    inquire into life, the nature of the mind, the psyche, and the spirit. As an
    intuition of other orders of knowledge and other orders of reality. As a
    respectful approach to nature. As a spiritual practice. Sciences of the
    environment, biodiversity, and the biosphere.
pillar_consciencia_title:
  es: Consciencia
  en: Consciousness
pillar_consciencia_desc:
  es: >
    Conciencia: fundamento ulterior. Exploración de la `consciencia de ser´ y el
    despertar colectivo hacia una nueva forma de relacionarnos.

    La conciencia como sustrato irreductible de todo proceso cognitivo: no la
    autoconciencia individual, sino la sustancia fundamental que es origen y
    basamento de toda fenomenología. Proponemos este concepto como contraparte
    de la inconsciencia o ignorancia del Ser.

    La conciencia no necesita avanzar, progresar ni evolucionar. Es un
    movimiento perpetuo unido al universo todo: no se mueve en él sino con él.
    En ese espacio inalterable se halla la conciencia humana en el camino del
    medio entre la conciencia animal y la conciencia pura o Absoluto —cual si
    fuesen capas de una cebolla, y cada capa respondiera a un campo mórfico
    único para cada especie en este planeta—.

    En el núcleo de lo perecedero está la chispa de la eternidad. En el núcleo
    de todas nuestras células mortales se halla incrustada la esencia
    impersonal, la inmortalidad en el corazón de la materia. Cuerpo físico,
    energía y conciencia constituyen una tríada alquímica absolutamente
    interdependiente.

    Nautas concibe la conciencia como un océano, desconocido en su mayor parte,
    y como campo de exploración que puede abordarse científicamente, esto es
    paso a paso, descubriendo una capa tras otra, reconociendo un rincón y otro
    en el universo humano —y algo más allá—. La aborda como sustrato de
    sabiduría intuitiva e inteligencia viva en todos los seres; como fundamento
    para la investigación científica, filosófica, ética, metafísica y religiosa,
    incluidas las ciencias de la meditación y las investigaciones acerca de la
    vitalidad física, el campo energético, la salud y la disfunción individual y
    colectiva.
  en: >-
    Consciousness: Essential Foundation. An exploration of the "consciousness of
    being" and the collective awakening toward a new way of relating.


    Consciousness as the irreducible substrate of all cognitive processes: not
    individual self-awareness, but the fundamental substance that is the origin
    and foundation of all phenomena. We propose this concept as the counterpart
    to unconsciousness or ignorance of Being.


    Consciousness does not need to advance, progress, or evolve. It is a
    perpetual movement united with the entire universe: it does not move within
    it, but with it. In this unalterable space, human consciousness finds itself
    on the intermediate path between animal consciousness and pure consciousness
    or the Absolute, like layers of an onion, each layer corresponding to a
    unique morphic field for each species on this planet.


    At the core of the perishable resides the spark of eternity. Embedded in the
    nucleus of all our mortal cells is the impersonal essence, immortality at
    the heart of matter. Physical body, energy, and consciousness constitute an
    absolutely interdependent alchemical triad. Nautas conceives of
    consciousness as an ocean, largely unknown, and as a field of exploration
    that can be approached scientifically—that is, step by step, uncovering one
    layer after another, recognizing one corner after another of the human
    universe, and something beyond. He approaches it as the substrate of
    intuitive wisdom and living intelligence in all beings; as the foundation of
    scientific, philosophical, ethical, metaphysical, and religious inquiry,
    including the sciences of meditation and research on physical vitality, the
    energy field, health, and individual and collective dysfunction.
vision_quote:
  es: >-
    "Observar es participar. Somos expresiones del universo experimentándose a
    sí mismo."
  en: >-
    "To observe is to participate. We are the universe experiencing itself
    through the lens of science and the soul."
