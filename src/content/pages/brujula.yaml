hero_title:
  es: Brújula
  en: Compass
hero_subtitle:
  es: >
    Hay personas, organizaciones y proyectos que, aun transitando caminos
    diferentes, miran hacia horizontes que sentimos cercanos. Nos inspiran
    quienes exploran nuevas formas de habitar el mundo, de vincularnos, de crear
    y de comprender la consciencia; quienes cuidan la Tierra, impulsan
    transformaciones sociales y abren espacios donde el arte y la ciencia pueden
    encontrarse con otras formas de conocimiento.


    BRÚJULA reúne esas voces y esos espacios que acompañan nuestro rumbo.
    Referencias con las que compartimos preguntas, búsquedas y sensibilidades, y
    cuyo trabajo queremos acercar, celebrar y difundir.


    Porque navegar también es reconocer a quienes, desde otros lugares, ayudan a
    orientarnos.
  en: >-
    There are people, organizations, and projects that, while following
    different paths, look toward horizons that feel close to us. We are inspired
    by those who explore new ways of inhabiting the world, relating to one
    another, creating, and understanding consciousness; those who care for the
    Earth, foster social transformation, and open spaces where art and science
    can meet other forms of knowledge.


    COMPASS brings together the voices and spaces that accompany our journey.
    References with whom we share questions, explorations, and sensibilities,
    and whose work we want to bring closer, celebrate, and share.


    Because navigating also means recognizing those who, from different places,
    help us find our way.
title:
  es: Nautas — Brújula
  en: Nautas — Compass
description:
  es: Recursos y aliados que acompañan nuestro rumbo.
