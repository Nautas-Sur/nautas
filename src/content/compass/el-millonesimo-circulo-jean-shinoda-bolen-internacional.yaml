name: El millonésimo círculo — Jean Shinoda Bolen (internacional)
presentation:
  es: >-
    Jean Shinoda Bolen es psiquiatra, analista junguiana y profesora clínica
    emérita de la Universidad de California en San Francisco, autora de trece
    libros traducidos a más de cien ediciones extranjeras, entre ellos El Tao de
    la psicología, Las diosas de cada mujer, Los dioses de cada hombre y
    Cruzando a Avalón. Fue delegada ante la Comisión de la ONU sobre la
    Condición de la Mujer y participó en tres documentales, entre ellos el
    ganador del Óscar Women — For America, For the World. En El millonésimo
    círculo, retoma la fábula del "centésimo mono" y la hipótesis de la
    resonancia mórfica de Rupert Sheldrake para proponer que los círculos de
    mujeres con un centro espiritual pueden acelerar un cambio cultural hacia
    una era post-patriarcal; el libro dio origen a la iniciativa internacional
    Millionth Circle. Fue entrevistada para Voces de la Tierra.
  en: >-
    Jean Shinoda Bolen is a psychiatrist, Jungian analyst, and clinical
    professor emerita at the University of California, San Francisco. She is the
    author of thirteen books translated into more than one hundred foreign
    editions, including *The Tao of Psychology*, *Goddesses in Every Woman, Gods
    in Every Man*, and *Crossing into Avalon*. She served as a delegate to the
    UN Commission on the Status of Women and participated in three
    documentaries, including the Oscar-winning *Women—For America, For the
    World*. In *The Millionth Circle*, she revisits the fable of the "hundredth
    monkey" and Rupert Sheldrake's morphic resonance hypothesis to propose that
    women's circles with a spiritual center can accelerate a cultural shift
    toward a post-patriarchal era; the book gave rise to the international
    Millionth Circle initiative. She was interviewed for Voices of the Earth.
