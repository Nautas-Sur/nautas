    Consultor en marketing, comunicación y producción con más de 30 años de
    experiencia en proyectos educativos, culturales, institucionales y
    comerciales. Ha trabajado tanto en el sector privado como en organizaciones
    sin fines de lucro, integrando saberes del mundo empresarial, la educación
    superior y la creatividad aplicada. 
  en: >-
    Marketing, communications, and production consultant with over 30 years of
