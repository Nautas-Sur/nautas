name: Sacha Laniado
role:
  es: producción sostenible y regeneración
  en: Sustainable Production and Regeneration
bio:
  es: >-
    Co-fundor de la Reserva ecológica Volcán Poca y de Traslasierra Ecofusión y
    Cerro del Cóndor.

    Desde hace más de 15 años es productor de Hierbas aromáticas y medicinales.
    Especializado en aprovechamiento de recursos del monte Nativo, difunde
    sistemas de producción y preservación sostenibles y respetuosas con el medio
    ambiente. Activista, miembro del Vivero comunitario de ciudad universitaria
    UBA,  y de la Red argentina de reservas naturales privadas, entre otras.
  en: >-
    Co-founder of the Volcán Poca Ecological Reserve and Traslasierra Ecofusión
    and Cerro del Cóndor.

    For over 15 years, he has been a producer of aromatic and medicinal herbs.
    Specializing in the sustainable use of native forest resources, he promotes
    environmentally friendly and sustainable production and preservation
    systems. An activist, he is a member of the community nursery at the
    University of Buenos Aires (UBA) campus and the Argentine Network of Private
    Nature Reserves, among other organizations.
order: 20
