name: Escuela de Astrología Casa XI (Argentina)
presentation:
  es: >-
    Fundada en 1987 en Buenos Aires por Eugenio Carutti —licenciado en
    Antropología por la UBA, con estudios previos de Física y una trayectoria
    como docente de Epistemología y Antropología Filosófica —, Casa XI se dedica
    a la investigación y transmisión de lo que denomina "astrología profunda":
    un enfoque transpersonal que entiende el lenguaje astrológico no como
    sistema predictivo sino como una vía de contacto vivo entre el cielo y la
    experiencia humana. Carutti es autor de libros como Las Lunas: el refugio de
    la memoria, Ascendentes en Astrología I y II e Inteligencia Planetaria. Fue
    uno de los primeros entrevistados de Voces de la Tierra, donde desarrolla la
    idea de la Tierra como un organismo vivo atravesado por una holo-evolución
    sistémica.
  en: >-
    Founded in 1987 in Buenos Aires by Eugenio Carutti—a graduate in
    Anthropology from the University of Buenos Aires, with prior studies in
    Physics and a background as a professor of Epistemology and Philosophical
    Anthropology—Casa XI is dedicated to the research and transmission of what
    it calls "deep astrology": a transpersonal approach that understands
    astrological language not as a predictive system but as a living connection
    between the heavens and human experience. Carutti is the author of books
    such as *Las Lunas: el refugio de la memoria* (The Moons: The Refuge of
    Memory), *Ascendentes en Astrología I y II* (Ascendants in Astrology I and
    II), and *Intelligencia Planetaria* (Planetary Intelligence). He was one of
    the first interviewees on *Voces de la Tierra* (Voices of the Earth), where
    he develops the idea of ​​the Earth as a living organism undergoing a
    systemic holo-evolution.
