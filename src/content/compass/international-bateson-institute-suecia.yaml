name: International Bateson Institute (Suecia)
presentation:
  es: >
    Fundado y presidido por Nora Bateson —cineasta, escritora e investigadora,
    hija del antropólogo cibernauta Gregory Bateson—, es una fundación en Suecia
    dedicada a la investigación transcontextual en ecología, economía, cultura,
    salud, educación y arte. Nora Bateson es creadora del concepto "Warm Data" y
    de los Warm Data Labs, un formato de indagación grupal replicado alrededor
    del mundo para explorar la complejidad de los sistemas vivos más allá de los
    datos cuantitativos aislados. Dirigió y produjo el documental An Ecology of
    Mind, retrato de su padre, y es autora de Small Arcs of Larger Circles y
    Combining & Belly donde propone una “ecología de la comunicación”, en la que
    comunicarnos no es simplemente transmitir información, sino modificar las
    relaciones y los contextos de los que formamos parte. Fue entrevistada en su
    casa de Estocolmo para el segundo episodio de Voces de la Tierra, donde
    habla sobre arte, ciencia, vínculos y tecnología.
  en: >-
    Founded and chaired by Nora Bateson—filmmaker, writer, and researcher,
    daughter of the cyber-anthropologist Gregory Bateson—it is a foundation in
    Sweden dedicated to transcontextual research in ecology, economics, culture,
    health, education, and art. Nora Bateson is the creator of the "Warm Data"
    concept and the Warm Data Labs, a group inquiry format replicated around the
    world to explore the complexity of living systems beyond isolated
    quantitative data. She directed and produced the documentary An Ecology of
    Mind, a portrait of her father, and is the author of Small Arcs of Larger
    Circles and Combining & Belly, where she proposes an "ecology of
    communication," in which communication is not simply transmitting
    information, but rather modifying the relationships and contexts of which we
    are a part. She was interviewed at her home in Stockholm for the second
    episode of Voices of the Earth, where she discusses art, science,
    relationships, and technology.
