name: Alianza Wichi (Argentina/España)
presentation:
  es: >-
    Organización de regeneración biocultural con sede en Salta y Barcelona que
    trabaja junto a comunidades indígenas del Gran Chaco argentino —wichí,
    weenhayek, chorote, qom, nivaclé, chané, guaraní y toba—, principalmente en
    las zonas de Tartagal, Santa Victoria Este, Rivadavia y el corredor del río
    Pilcomayo. Su trabajo se organiza en torno a ocho ejes: agua e
    infraestructura comunitaria, soberanía alimentaria, restauración de bosque
    nativo, educación y liderazgo juvenil, investigación y conocimiento
    indígena, defensa legal y derechos territoriales, bienestar comunitario y
    liderazgo de mujeres, y desarrollo económico local. A través de fallos
    judiciales la Alianza ha protegido 690 hectáreas de territorio indígena, y
    sostiene cinco viveros comunitarios de árboles nativos. Está representada en
    este proyecto por Martín Kraft, quien además fue director de cámara de la
    serie documental Voces de la Tierra.
  en: >-
    A biocultural regeneration organization based in Salta and Barcelona,
    ​​working alongside Indigenous communities in the Argentine Gran
    Chaco—Wichí, Weenhayek, Chorote, Qom, Nivaclé, Chané, Guaraní, and
    Toba—primarily in the areas of Tartagal, Santa Victoria Este, Rivadavia, and
    the Pilcomayo River corridor. Its work is organized around eight key areas:
    water and community infrastructure, food sovereignty, native forest
    restoration, education and youth leadership, Indigenous research and
    knowledge, legal defense and territorial rights, community well-being and
    women's leadership, and local economic development. Through court rulings,
    the Alliance has protected 690 hectares of Indigenous territory and
    maintains five community nurseries of native trees. It is represented in
    this project by Martín Kraft, who was also the director of photography for
    the documentary series Voices of the Earth.
