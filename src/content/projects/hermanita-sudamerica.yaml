  - number: 3
    videoId: e_QJZdNff1M
    title:
      es: Hermanita Sudamérica - Ecuador
      en: Souyh American Little Sister - Perú
    description:
      es: >-
        Hermanita Sudamérica profundiza en la en esencia cultural de cada país
        de  Sudamérica a la vez que  construye un puente con el desarrollo
        tecnológico y sociológico actual. Propone la creación de una identidad
        primordialmente Sudamericana, basándose en la documentación etnográfica
        y antropológica de pueblos originarios, escenarios urbanos, reseñas
        históricas y geopolíticas de cada país. 

        Ame es una animación, una niña que presenta cada uno de los programas
        con locuciones inteligentes y sensibles a la vez. Emociona desde su
        mirada sin prejuicios y genera consciencia desde su calidez humanista.
      en: >-
        Hermanita Sudamérica delves into the cultural essence of each South
        American country while building a bridge to current technological and
        sociological developments. It proposes the creation of a primarily South
        American identity, based on ethnographic and anthropological
        documentation of indigenous peoples, urban landscapes, and historical
        and geopolitical overviews of each country. Ame is an animated
        character, a little girl who presents each program with intelligent and
        sensitive voiceovers. She moves viewers with her unprejudiced
        perspective and raises awareness with her humanistic warmth.
