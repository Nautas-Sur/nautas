name: Schumacher College (Reino Unido)
presentation:
  es: >-
    Fundada en Devon por Satish Kumar junto educadores y ecologistas, es una de
    las instituciones pioneras a nivel mundial en educación holística, ecológica
    y transdisciplinaria. Sus programas —cortos y de larga duración,
    presenciales y en línea— abordan en un diseño ecológico, la economía
    regenerativa, poética de la imaginación y la educación ambiental
    comprometida, bajo la premisa de aprender integrando cabeza, corazón, manos
    y hábitat: teoría, práctica corporal, comunidad y Tierra como partes de un
    mismo proceso formativo. Con más de tres décadas de trayectoria, atraviesa
    un proceso de relanzamiento sostenido por una red creciente de colaboradores
    en distintos países. 
  en: >-
    Founded in Devon by Satish Kumar, along with educators and
    environmentalists, it is one of the world's pioneering institutions in
    holistic, ecological, and transdisciplinary education. Its programs—both
    short and long, in-person and online—address ecological design, regenerative
    economics, the poetics of imagination, and committed environmental
    education, based on the premise of learning by integrating head, heart,
    hands, and habitat: theory, embodied practice, community, and Earth as parts
    of a single formative process. With over three decades of experience, it is
    undergoing a sustained relaunch supported by a growing network of
    collaborators in various countries.
