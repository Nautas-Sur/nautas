hero_title:
  es: Una nave compartida, *un mismo destino.*
  en: A shared vessel, *a common destiny.*
hero_subtitle:
  es: >-
    NAUTAS es una asociación sin fines de lucro dedicada a la producción
    audiovisual y la investigación cultural en la intersección del arte, la
    ciencia y la consciencia.
  en: >-
    NAUTAS is a non-profit association dedicated to audiovisual production and
    cultural research at the intersection of art, science, and consciousness.
mission_title:
  es: Nuestro *Propósito*
  en: Our *Purpose*
mission_p1:
  es: >-
    NAUTAS es una entidad civil, de bien público, sin fines de lucro, cuya
    finalidad social es la promoción y difusión de contenidos que responden a
    tres áreas principales: arte, ciencia e investigaciones acerca del espíritu
    y la consciencia humana.
  en: >-
    NAUTAS is a civil, public-benefit, non-profit entity whose social purpose is
    the promotion and dissemination of content across three main areas: art,
    science, and research on the human spirit and consciousness.
mission_p2:
  es: >-
    La vocación de sus integrantes es propiciar la comunicación de ideas y el
    desarrollo de actividades que favorezcan la interacción social y la
    integración de una gran diversidad cultural.
  en: >-
    The vocation of its members is to foster the communication of ideas and the
    development of activities that promote social interaction and the
    integration of vast cultural diversity.
mission_p3:
  es: >-
    Incluye entre sus premisas fundacionales el estudio y la aplicación de
    diferentes conocimientos que contemplen la búsqueda de una convivencia
    armoniosa y la mejor utilización de los recursos naturales. Esto implica la
    transmisión de conocimientos y prácticas concretas adecuadas a la realidad
    social de nuestro tiempo.
  en: >-
    Its founding premises include the study and application of different forms
    of knowledge aimed at harmonious coexistence and the best use of natural
    resources. This implies the transmission of knowledge and concrete practices
    suited to the social reality of our time.
mission_p4:
  es: >-
    Para el desarrollo de estas actividades se dedica a la producción de
    eventos, conferencias, cursos, talleres, contenidos audiovisuales e
    intervenciones artísticas de distinta índole, asociados a mensajes y
    personalidades mundialmente reconocidas por su intento de consolidación de
    nuevos paradigmas, edificadores de un mundo culturalmente más evolucionado,
    más consciente y en armonía con la naturaleza.
  en: >-
    To develop these activities, it is dedicated to producing events,
    conferences, courses, workshops, audiovisual content, and artistic
    interventions of various kinds, associated with messages and personalities
    recognized worldwide for their attempt to consolidate new paradigms —
    builders of a culturally more evolved, more conscious world in harmony with
    nature.
mission_p5:
  es: >-
    Nautas promueve, asimismo, el desarrollo de nuevas expresiones que sirvan
    para incrementar la salud de la sociedad, del medio ambiente, la
    comunicación, las relaciones personales y las artes a través del continente
    y del mundo, difundiendo su conocimiento en forma educativa y lúdica,
    estimulando la cooperación y la creatividad.
  en: >-
    Nautas also promotes the development of new expressions that serve to
    enhance the health of society, the environment, communication, personal
    relationships, and the arts across the continent and the world,
    disseminating knowledge in an educational and playful way, stimulating
    cooperation and creativity.
mission_cta:
  es: >-
    Los invitamos a participar activa y comprometidamente con nuestras
    propuestas.
  en: We invite you to participate actively and wholeheartedly in our proposals.
vision_title:
  es: Visión *Participativa*
  en: Participatory *Vision*
vision_p1:
  es: >-
    El propósito de Nautas no está "definido", no es algo a alcanzar sino algo a
    construir entre todos conjuntamente. Porque un nuevo paradigma ha de emerger
    precisamente como algo diferente de lo hasta ahora conocido.
  en: >-
    The purpose of Nautas is not "defined" — it is not something to reach but
    something to build together. For a new paradigm must emerge precisely as
    something new, different from what has been known so far.
vision_p2:
  es: >-
    En este sentido, el propósito que nos aúna es el de crear, como si
    compusiéramos una obra, una visión multi-participativa, en varios planos o
    dimensiones creativas, que pueda reflejar la vitalidad y la inteligencia que
    surgen cuando somos capaces de conectar con la verdad del corazón y movernos
    en el mundo desde allí.
  en: >-
    In this sense, the purpose that unites us is to create, as if composing a
    work of art, a multi-participatory vision across several planes or creative
    dimensions — one that can reflect the vitality and intelligence that arise
    when we connect with the truth of the heart and move through the world from
    there.
vision_p3:
  es: >-
    Más que instruir o enseñar, lo que nos convoca es poner a disposición del
    público herramientas que posibiliten la participación y la comunicación
    libre e interactiva para crear una forma verdaderamente nueva de
    relacionarnos.
  en: >-
    More than instructing or teaching, what calls us is to make available to the
    public tools that enable participation and free, interactive communication
    to create a truly new way of relating to one another.
vision_blockquote:
  es: >-
    "Navegamos a bordo de una misma nave: el planeta Tierra. Nuestro destino
    está ligado al designio de su Espíritu."
  en: >-
    "We sail aboard the same vessel: planet Earth. Our destiny is linked to the
    design of its Spirit."
vision_p4:
  es: >-
    El planeta está dando señales de un movimiento que incumbe a todos sus
    habitantes. Existen varias formas posibles en que podemos responder a este
    movimiento y eso no significa que debamos "hacer" algo sino tal vez estar
    más receptivos y disponibles para responder al cambio que se está
    evidenciando a todo nuestro alrededor.
  en: >-
    The planet is signaling a movement that concerns all its inhabitants. There
    are several possible ways we can respond to this movement, and that does not
    mean we must "do" something but perhaps be more receptive and available to
    respond to the change that is becoming evident all around us.
vision_p5:
  es: >-
    No hay manual de instrucciones para quienes se adentren en las profundidades
    de un viaje de consciencia colectivo, pero hay algunas variables que pueden
    hacer de nuestro viaje una pesadilla o una aventura conjunta en la cual
    descubrimos lo mejor que cada uno puede darse a sí mismo y a los compañeros
    de ruta.
  en: >-
    There is no instruction manual for those venturing into the depths of a
    collective consciousness journey, but there are some variables that can make
    our journey a nightmare or a joint adventure in which we discover the best
    each one can give to themselves and their fellow travelers.
team_title:
  es: Nuestro *Equipo*
  en: Our *Team*
team_subtitle:
  es: Una tripulación multidisciplinaria unida por la misma órbita.
  en: A multidisciplinary crew united by the same orbit.
cta_title:
  es: ¿Querés acompañar *el rumbo?*
  en: Ready to chart *the course?*
cta_subtitle:
  es: Escribinos, sumate al equipo o explorá nuestros proyectos.
  en: Write to us, join the team, or explore our projects.
title:
  es: Nautas — Institucional
  en: Nautas — About
