name: Santos Tiscornia
role:
  es: Coordinación estratégica y producción general.
  en: Strategic coordination and general production.
bio:
  es: >-
    Fundador y presidente de Nautas. Durante más de 30 años trabajó en
    comunicación, marketing y producción cultural: dirigió agencias, lideró
    lanzamientos y campañas, y asesoró a universidades, empresas y
    organizaciones en procesos de innovación. Con el tiempo amplió su mirada
    hacia la antropología, el arte, la educación, la tecnología y la
    investigación sobre la consciencia. Le interesa lo que surge cuando
    distintos saberes dialogan, especialmente el vínculo entre conocimiento y
    experiencia. En Nautas impulsa proyectos que integran arte, ciencia y
    consciencia, con la búsqueda de hacer accesibles ideas profundas sin
    simplificarlas. Su formación abarca marketing, antropología y derecho.
  en: >-
    Founder and president of Nautas. For over 30 years he has worked in
    communication, marketing, and cultural production, leading agencies,
    launches, and campaigns, and advising universities, companies, and
    organizations on innovation processes. Over time, he broadened his
    perspective toward anthropology, art, education, technology, and
    consciousness research. He is drawn to what emerges when different fields of
    knowledge enter into dialogue, especially the relationship between knowledge
    and experience. At Nautas, he drives projects that integrate art, science,
    and consciousness, seeking to make profound ideas accessible without
    oversimplifying them. His academic background spans marketing, anthropology,
    and law.
order: 30
