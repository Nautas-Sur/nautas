name: Julia Ponce
role:
  es: Productora
  en: Producer
bio:
  es: >-
    Julia Inés Ponce es música, diseñadora de sonido y gestora cultural. Se
    formó en Performance en la Escuela de Música Contemporánea – Berklee
    International Network y en Diseño de Sonido en la ENERC-INCAA. Amplió su
    formación en Síntesis del Sonido y Tecnologías Aplicadas al Arte en la UNA,
    donde actualmente cursa la Maestría en Cultura Pública. Dirige DATX,
    proyecto de producción musical y desarrollo de artistas emergentes de la
    Patagonia. Ha gestionado proyectos con fondos nacionales e internacionales y
    acompaña a Nautas en la formulación de proyectos culturales.
  en: >-
    Julia Inés Ponce is a musician, sound designer, and cultural manager. She
    trained in Performance at the Berklee International Network School of
    Contemporary Music and in Sound Design at ENERC-INCAA. She furthered her
    studies in Sound Synthesis and Technologies Applied to Art at UNA, where she
    is currently pursuing a Master's degree in Public Culture. She directs DATX,
    a music production and emerging artist development project in Patagonia. She
    has managed projects with national and international funding and
    collaborates with Nautas in the development of cultural projects.
order: 12
